name: Test Workflow Trigger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Echo test
        run: |
          echo "✅ Workflows are active!"
          echo "Repository: StellaRust"
          echo "Branch: ${{ github.ref }}"
